name: Migrations

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "db/migrations/**"
      - "alembic.ini"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    name: migrations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        # Keep in sync with the team Supabase major version
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check for a single migration head
        run: |
          heads=$(alembic heads | grep -c '(head)' || true)
          if [ "$heads" -ne 1 ]; then
            echo "::error::Found $heads Alembic heads, expected 1. Rebase on main and point your migration's down_revision at main's head."
            exit 1
          fi

      - name: Create Supabase roles
        run: psql "$SUPABASE_DB_URL" -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS;"

      - name: Apply all migrations to an empty database
        run: alembic upgrade head

  deploy:
    name: Apply migrations to production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: migrations-production
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Apply pending migrations
        run: alembic upgrade head
